<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* Placeholders: replace all three with the film's own palette and display face. */
      :root {
        --ground: #0b1020;
        --ink: #ffffff;
        --accent: #4f8cff;
        --font-display: sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
        flex-direction: column;
        gap: 28px;
      }
      #bar {
        width: 360px;
        height: 8px;
        border-radius: 4px;
        background: var(--accent);
        transform-origin: left center;
        position: absolute;
        left: 780px;
        top: 660px;
      }
      #title {
        color: var(--ink);
        font-size: 120px;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <h1 id="title" class="clip" data-start="0" data-duration="5" data-track-index="0">Meu primeiro vídeo</h1>
      <div id="bar" class="clip" data-start="0" data-duration="5" data-track-index="1"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#title", { opacity: 1, y: 24, scale: 0.94, filter: "blur(0px)" }, { y: 0, scale: 1, duration: 1.2, ease: "power3.out" }, 0);
      tl.fromTo("#bar", { scaleX: 0 }, { scaleX: 1, duration: 1.2, ease: "power2.inOut" }, 1.0);
      tl.to("#title", { opacity: 0, duration: 0.6, ease: "power2.in" }, 4.3);
      tl.to("#bar", { opacity: 0, duration: 0.6, ease: "power2.in" }, 4.3);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
